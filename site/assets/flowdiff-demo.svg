<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FlowDiff synthetic parity report</title>
  <desc id="desc">A dark report card comparing a candidate dictation experience with a baseline using eight capability rows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1a1d28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#52d9c3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="210" fill="#8b7cff" opacity=".1"/>
  <circle cx="140" cy="720" r="220" fill="#52d9c3" opacity=".08"/>
  <rect x="56" y="48" width="1088" height="700" rx="24" fill="#171a23" stroke="#303544" filter="url(#shadow)"/>
  <text x="96" y="112" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">FLOWDIFF</text>
  <text x="96" y="144" fill="#9299aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">synthetic parity report · Candidate vs Baseline</text>
  <rect x="862" y="88" width="226" height="34" rx="17" fill="#24283a" stroke="#3b4160"/>
  <circle cx="884" cy="105" r="6" fill="#52d9c3"/>
  <text x="900" y="111" fill="#b9c0d2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="600">REDACTED TRACE ONLY</text>
  <rect x="96" y="184" width="1016" height="104" rx="18" fill="#202430"/>
  <text x="126" y="220" fill="#8f97aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">CANDIDATE SCORE</text>
  <text x="126" y="263" fill="url(#accent)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">62.5%</text>
  <text x="370" y="220" fill="#8f97aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">PARITY</text>
  <text x="370" y="263" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">50.0%</text>
  <text x="614" y="220" fill="#8f97aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">GAPS FOUND</text>
  <text x="614" y="263" fill="#ffbd7a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">4</text>
  <text x="810" y="220" fill="#8f97aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">DATA STORED</text>
  <text x="810" y="263" fill="#52d9c3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">NONE</text>
  <text x="126" y="336" fill="#70788b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">CAPABILITY</text>
  <text x="476" y="336" fill="#70788b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">BASELINE</text>
  <text x="650" y="336" fill="#70788b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">CANDIDATE</text>
  <text x="850" y="336" fill="#70788b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">RESULT</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">
    <rect x="96" y="354" width="1016" height="42" rx="10" fill="#1d202b"/>
    <text x="126" y="381" fill="#e7e9ee">Activation</text><text x="476" y="381" fill="#52d9c3">pass</text><text x="650" y="381" fill="#52d9c3">pass</text><text x="850" y="381" fill="#9da5b7">match</text>
    <rect x="96" y="402" width="1016" height="42" rx="10" fill="#202430"/>
    <text x="126" y="429" fill="#e7e9ee">Recording feedback</text><text x="476" y="429" fill="#52d9c3">pass</text><text x="650" y="429" fill="#52d9c3">pass</text><text x="850" y="429" fill="#9da5b7">match</text>
    <rect x="96" y="450" width="1016" height="42" rx="10" fill="#1d202b"/>
    <text x="126" y="477" fill="#e7e9ee">Insertion</text><text x="476" y="477" fill="#52d9c3">pass</text><text x="650" y="477" fill="#52d9c3">pass</text><text x="850" y="477" fill="#9da5b7">match</text>
    <rect x="96" y="498" width="1016" height="42" rx="10" fill="#202430"/>
    <text x="126" y="525" fill="#e7e9ee">Settings</text><text x="476" y="525" fill="#52d9c3">pass</text><text x="650" y="525" fill="#ffbd7a">partial</text><text x="850" y="525" fill="#ffbd7a">gap</text>
    <rect x="96" y="546" width="1016" height="42" rx="10" fill="#1d202b"/>
    <text x="126" y="573" fill="#e7e9ee">History</text><text x="476" y="573" fill="#52d9c3">pass</text><text x="650" y="573" fill="#ff7d91">fail</text><text x="850" y="573" fill="#ff7d91">gap</text>
    <rect x="96" y="594" width="1016" height="42" rx="10" fill="#202430"/>
    <text x="126" y="621" fill="#e7e9ee">Privacy</text><text x="476" y="621" fill="#52d9c3">pass</text><text x="650" y="621" fill="#52d9c3">pass</text><text x="850" y="621" fill="#9da5b7">match</text>
    <rect x="96" y="642" width="1016" height="42" rx="10" fill="#1d202b"/>
    <text x="126" y="669" fill="#e7e9ee">Recovery</text><text x="476" y="669" fill="#52d9c3">pass</text><text x="650" y="669" fill="#ffbd7a">partial</text><text x="850" y="669" fill="#ffbd7a">gap</text>
    <rect x="96" y="690" width="1016" height="42" rx="10" fill="#202430"/>
    <text x="126" y="717" fill="#e7e9ee">Multi-display</text><text x="476" y="717" fill="#52d9c3">pass</text><text x="650" y="717" fill="#ff7d91">fail</text><text x="850" y="717" fill="#ff7d91">gap</text>
  </g>
  <text x="96" y="744" fill="#6f7789" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">FLOWDIFF / v0.1 · no audio · no transcripts · no cloud</text>
</svg>
